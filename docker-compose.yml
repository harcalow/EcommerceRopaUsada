# Infraestructura de desarrollo (ADR-003). Variables: ver .env.example.
# Solo infraestructura:  docker compose up -d
# Con aplicaciones:      docker compose --profile apps up -d

name: perchados

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Emulador S3: SeaweedFS (Apache-2.0). MinIO CE ya no publica imágenes (ADR-003).
  storage:
    image: chrislusf/seaweedfs:4.48
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256
      -s3 -s3.port=9000
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
    ports:
      - "${STORAGE_API_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:8888"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:8888/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Tarea de un solo uso: crea el bucket si no existe y termina.
  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name $${STORAGE_BUCKET}" | weed shell -master=storage:9333
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_CONTACT_EMAIL: ${ADMIN_CONTACT_EMAIL:-}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
  mailpit-data:
  api-node-modules:
  web-node-modules:
